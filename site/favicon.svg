<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Data Usage Dashboard">
  <!-- True-black tile so the mark keeps its own ground on light browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#000000"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#1e1e22"/>
  <!-- Three ascending bars, Tech Blue, lightest to brightest.
       Bars are 6 units wide with 3-unit gaps. That is a legibility constraint,
       not taste: browsers rasterise this to 16px in the tab strip, and thinner
       bars with tighter gaps smear into one block because the gap columns never
       reach true black. Keep these proportions if you redraw it. -->
  <rect x="4"  y="19" width="6" height="8"  rx="1.8" fill="#1f5fb0"/>
  <rect x="13" y="12" width="6" height="15" rx="1.8" fill="#2f80ed"/>
  <rect x="22" y="6"  width="6" height="21" rx="1.8" fill="#6fb0ff"/>
</svg>
